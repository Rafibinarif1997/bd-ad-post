<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপন দিন — BD AD POST</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="container topin"><a class="logo" href="index.html">🇧🇩 <b>BD AD POST</b></a><nav id="authNav"></nav></div></header><main class="section"><div class="container"><div class="formCard"><span class="eyebrow">FREE BUSINESS LISTING</span><h1>আপনার ব্যবসা যোগ করুন</h1><div class="notice">Submit করার পর Admin review করবে। Approve হলে listing live হবে।</div><div id="msg"></div><div class="two"><label>প্রতিষ্ঠানের নাম *<input id="business_name" class="input"></label><label>ক্যাটাগরি *<select id="category" class="input"><option value="">নির্বাচন করুন</option><option>রেস্টুরেন্ট</option><option>ফ্যাশন</option><option>ইলেকট্রনিক্স</option><option>সার্ভিস</option><option>শিক্ষা</option><option>হেলথ</option><option>অন্যান্য</option></select></label></div><div class="two"><label>জেলা *<input id="district" class="input"></label><label>এলাকা/উপজেলা *<input id="area" class="input"></label></div><label>ঠিকানা *<input id="address" class="input"></label><div class="two"><label>ফোন *<input id="phone" class="input"></label><label>Website<input id="website" class="input"></label></div><label>Facebook<input id="facebook" class="input"></label><label>বিস্তারিত বিবরণ *<textarea id="description" class="input"></textarea></label><label>প্রতিষ্ঠানের ছবি<input id="image" class="input" type="file" accept="image/*"></label><button id="submit" class="btn" onclick="submitAd()">Approval-এর জন্য Submit করুন</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{loadNav();await protect()})</script></body></html>
