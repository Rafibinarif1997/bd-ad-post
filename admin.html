<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Control Center — BD AD POST</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="top"><div class="container topin"><a class="logo" href="index.html">🇧🇩 <b>BD AD POST</b> <small>ADMIN</small></a><nav><a href="index.html">সাইট দেখুন</a><button class="btn secondary" onclick="logout()">লগআউট</button></nav></div></header>
<main class="section"><div class="container">
<div class="sectionHead"><div><span class="eyebrow">CONTROL CENTER</span><h1>Admin Dashboard</h1><p>Ads, payments, users এবং Featured listings এক জায়গা থেকে পরিচালনা করুন।</p></div></div>
<div class="stats" id="stats"></div>
<div class="adminTabs"><button onclick="loadPending()">🟡 Pending Ads</button><button onclick="loadApproved()">🟢 Live Ads</button><button onclick="loadRejected()">🔴 Rejected</button><button onclick="loadPayments()">💳 Payments</button></div>
<div id="adminRows"></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
let isAdmin=false;
async function initAdmin(){if(!await adminCheck())return;await refreshStats();loadPending()}
async function adminCheck(){let s=await protect();if(!s)return false;let p=(await sb.from('profiles').select('role').eq('id',s.user.id).single()).data;if(p?.role!=='admin'){document.body.innerHTML='<div class="empty"><h2>Admin permission প্রয়োজন</h2><a class="btn" href="index.html">হোমে যান</a></div>';return false}isAdmin=true;return true}
async function refreshStats(){let [p,a,r,u,pa]=await Promise.all([sb.from('ads').select('*',{count:'exact',head:true}).eq('status','pending'),sb.from('ads').select('*',{count:'exact',head:true}).eq('status','approved'),sb.from('ads').select('*',{count:'exact',head:true}).eq('status','rejected'),sb.from('profiles').select('*',{count:'exact',head:true}),sb.from('payments').select('*',{count:'exact',head:true}).eq('status','pending')]);document.querySelector('#stats').innerHTML=`<div>🟡 Pending Ads<b>${p.count||0}</b></div><div>🟢 Live Ads<b>${a.count||0}</b></div><div>💳 Pending Payments<b>${pa.count||0}</b></div><div>👤 Users<b>${u.count||0}</b></div><div>🔴 Rejected<b>${r.count||0}</b></div>`}
async function loadPending(){let {data}=await sb.from('ads').select('*,profiles(full_name,email)').eq('status','pending').order('created_at',{ascending:true});renderAds(data,'pending')}
async function loadApproved(){let {data}=await sb.from('ads').select('*,profiles(full_name,email)').eq('status','approved').order('created_at',{ascending:false});renderAds(data,'approved')}
async function loadRejected(){let {data}=await sb.from('ads').select('*,profiles(full_name,email)').eq('status','rejected').order('created_at',{ascending:false});renderAds(data,'rejected')}
function renderAds(data,type){document.querySelector('#adminRows').innerHTML=(data||[]).map(a=>`<article class="adminCard"><div class="adminImg">${a.image_url?`<img src="${esc(a.image_url)}">`:'🏪'}</div><div class="adminInfo"><div class="row"><span class="featured">${a.featured?'⭐ FEATURED':''}</span><span class="badge ${a.status}">${a.status}</span></div><h2>${esc(a.business_name)}</h2><p><b>${esc(a.category)}</b> · 📍 ${esc(a.district)}, ${esc(a.area)}</p><p>👤 ${esc(a.profiles?.full_name||'')} · ${esc(a.profiles?.email||'')}</p><p>📞 ${esc(a.phone)}</p><p>${esc(a.description).slice(0,180)}</p>${a.rejection_reason?`<p class="rejectReason">Reason: ${esc(a.rejection_reason)}</p>`:''}<div class="actions">${type==='pending'?`<button class="btn" onclick="approveAd('${a.id}')">✅ Approve</button><button class="btn danger" onclick="rejectAd('${a.id}')">❌ Reject</button>`:''}${type==='approved'?`<button class="btn gold" onclick="toggleFeatured('${a.id}',${!a.featured})">${a.featured?'⭐ Unfeature':'⭐ Make Featured'}</button><button class="btn danger" onclick="disableAd('${a.id}')">Disable</button>`:''}</div></div></article>`).join('')||'<div class="empty">কোনো listing নেই।</div>'}
async function approveAd(id){let {error}=await sb.from('ads').update({status:'approved',rejection_reason:null,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await refreshStats();loadPending()}
async function rejectAd(id){let reason=prompt('Reject করার কারণ লিখুন:','তথ্য অসম্পূর্ণ');if(reason===null)return;let {error}=await sb.from('ads').update({status:'rejected',rejection_reason:reason,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await refreshStats();loadPending()}
async function disableAd(id){if(!confirm('এই listing reject/disable করবেন?'))return;await sb.from('ads').update({status:'rejected',rejection_reason:'Admin disabled this listing',updated_at:new Date().toISOString()}).eq('id',id);await refreshStats();loadApproved()}
async function toggleFeatured(id,v){let {error}=await sb.from('ads').update({featured:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await refreshStats();loadApproved()}
async function loadPayments(){let {data,error}=await sb.from('payments').select('*,ads(business_name,phone,district,area),profiles(full_name,email)').order('created_at',{ascending:false});if(error){return document.querySelector('#adminRows').innerHTML='<div class="notice">'+esc(error.message)+'</div>'}document.querySelector('#adminRows').innerHTML=(data||[]).map(p=>`<article class="paymentCard"><div><span class="badge ${p.status}">${esc(p.status)}</span><h2>৳${esc(p.amount)} · ${esc((p.package||'').toUpperCase())}</h2><p><b>Business:</b> ${esc(p.ads?.business_name||'')}</p><p><b>User:</b> ${esc(p.profiles?.full_name||'')} · ${esc(p.profiles?.email||'')}</p><p><b>Phone:</b> ${esc(p.ads?.phone||'')}</p><p><b>bKash TXN:</b> <code>${esc(p.transaction_id||'')}</code></p><p><b>Submitted:</b> ${new Date(p.created_at).toLocaleString('bn-BD')}</p></div><div class="actions">${p.status==='pending'?`<button class="btn" onclick="verifyPayment('${p.id}','${p.ad_id}','${esc(p.package||'')}')">✅ Verify & Activate</button><button class="btn danger" onclick="rejectPayment('${p.id}')">❌ Reject</button>`:'—'}</div></article>`).join('')||'<div class="empty">Payment record নেই।</div>'}
async function verifyPayment(paymentId,adId,pkg){if(!confirm('Transaction ID ও amount bKash-এ যাচাই করেছেন? Verify করলে promotion চালু হবে।'))return;let days=pkg==='starter'?7:pkg==='popular'?15:30;let expiry=new Date(Date.now()+days*86400000).toISOString();let {error}=await sb.from('payments').update({status:'paid'}).eq('id',paymentId);if(error)return alert(error.message);let r=await sb.from('ads').update({featured:true,promotion_expires_at:expiry,updated_at:new Date().toISOString()}).eq('id',adId);if(r.error)alert(r.error.message);await refreshStats();loadPayments()}
async function rejectPayment(id){let reason=prompt('Payment reject করার কারণ:','Transaction যাচাই করা যায়নি');if(reason===null)return;let {error}=await sb.from('payments').update({status:'rejected'}).eq('id',id);if(error)alert(error.message);loadPayments()}
document.addEventListener('DOMContentLoaded',initAdmin);
</script></body></html>
