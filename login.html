<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>লগইন | শাহমাহমুদপুর বাজার</title>  <link rel="stylesheet" href="style.css">  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .auth-box {
      width: min(100%, 430px);
      padding: 30px;
      border: 1px solid rgba(105,245,165,.16);
      border-radius: 14px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.05),
          rgba(255,255,255,.015)
        );
      box-shadow:
        0 25px 80px rgba(0,0,0,.4),
        0 0 35px rgba(105,245,165,.06);
      backdrop-filter: blur(18px);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand strong {
      display: block;
      color: var(--green);
      font-size: 20px;
      text-shadow: 0 0 18px rgba(105,245,165,.4);
    }

    .auth-brand span {
      font-size: 20px;
      font-weight: 900;
    }

    .auth-brand small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 7px;
      letter-spacing: 2px;
    }

    .auth-title {
      font-size: 25px;
      letter-spacing: -.8px;
      margin-bottom: 6px;
    }

    .auth-description {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .auth-field {
      margin-bottom: 15px;
    }

    .auth-field label {
      display: block;
      color: #aabbb1;
      font-size: 8px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-field input {
      width: 100%;
      height: 45px;
      border: 1px solid rgba(105,245,165,.14);
      border-radius: 6px;
      background: rgba(255,255,255,.035);
      color: white;
      outline: none;
      padding: 0 12px;
      font-size: 10px;
    }

    .auth-field input:focus {
      border-color: rgba(105,245,165,.6);
      box-shadow: 0 0 20px rgba(105,245,165,.08);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 8px;
      top: 8px;
      height: 29px;
      border: 0;
      border-radius: 4px;
      background: rgba(105,245,165,.07);
      color: var(--green);
      padding: 0 8px;
      font-size: 7px;
      font-weight: 900;
    }

    .auth-submit {
      width: 100%;
      height: 45px;
      border: 1px solid var(--green);
      border-radius: 6px;
      background: var(--green);
      color: #041009;
      font-size: 9px;
      font-weight: 950;
      margin-top: 4px;
      box-shadow: 0 0 25px rgba(105,245,165,.15);
      transition: .2s;
    }

    .auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(105,245,165,.28);
    }

    .auth-submit:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .auth-message {
      display: none;
      margin-top: 13px;
      padding: 10px;
      border-radius: 5px;
      font-size: 8px;
      line-height: 1.5;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      color: #ff9ba9;
      background: rgba(255,70,100,.07);
      border: 1px solid rgba(255,70,100,.15);
    }

    .auth-message.success {
      color: var(--green);
      background: rgba(105,245,165,.06);
      border: 1px solid rgba(105,245,165,.15);
    }

    .auth-links {
      display: flex;
      justify-content: space-between;
      margin-top: 17px;
    }

    .auth-links a {
      color: var(--green);
      font-size: 8px;
      font-weight: 800;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 23px 0;
      color: #53645a;
      font-size: 7px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(105,245,165,.1);
    }

    .back-home {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 8px;
    }

    .back-home:hover {
      color: var(--green);
    }

    @media(max-width:500px) {
      .auth-box {
        padding: 24px 19px;
      }
    }
  </style></head><body>  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="ambient-grid"></div>  <main class="auth-page"><section class="auth-box">

  <div class="auth-brand">
    <strong>শাহমাহমুদপুর</strong>
    <span>বাজার</span>
    <small>THE LOCAL MARKETPLACE</small>
  </div>

  <h1 class="auth-title">স্বাগতম 👋</h1>

  <p class="auth-description">
    আপনার account-এ login করুন এবং আপনার বিজ্ঞাপন,
    Favourite ও messages পরিচালনা করুন।
  </p>

  <form id="loginForm">

    <div class="auth-field">
      <label for="loginEmail">
        EMAIL
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="আপনার email লিখুন"
        autocomplete="email"
        required
      >
    </div>

    <div class="auth-field">

      <label for="loginPassword">
        PASSWORD
      </label>

      <div class="password-wrap">

        <input
          id="loginPassword"
          type="password"
          placeholder="আপনার password"
          autocomplete="current-password"
          required
        >

        <button
          class="show-password"
          id="togglePassword"
          type="button"
        >
          SHOW
        </button>

      </div>

    </div>

    <button
      class="auth-submit"
      id="loginSubmit"
      type="submit"
    >
      LOGIN →
    </button>

    <div
      id="loginMessage"
      class="auth-message"
    ></div>

  </form>

  <div class="auth-links">

    <a href="#" id="forgotPassword">
      Password ভুলে গেছেন?
    </a>

    <a href="register.html">
      নতুন account →
    </a>

  </div>

  <div class="auth-divider">
    SHAHMAHMUDPUR BAZAR
  </div>

  <a
    href="index.html"
    class="back-home"
  >
    ← Homepage-এ ফিরে যান
  </a>

</section>

  </main>  <script src="auth.js"></script></body>
</html>
